name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: md2pdf-linux-x86_64
            binary: md2pdf
            package: md2pdf-linux-x86_64.tar.gz
          - name: Windows x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: md2pdf-windows-x86_64
            binary: md2pdf.exe
            package: md2pdf-windows-x86_64.zip
          - name: macOS arm64
            runner: macos-15
            target: aarch64-apple-darwin
            archive: md2pdf-macos-arm64
            binary: md2pdf
            package: md2pdf-macos-arm64.tar.gz

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke-test release binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          "$binary" --version
          "$binary" example.md --output smoke-test.pdf --quiet
          test -s smoke-test.pdf

      - name: Smoke-test release binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          & $binary --version
          & $binary example.md --output smoke-test.pdf --quiet
          if (-not (Test-Path smoke-test.pdf) -or (Get-Item smoke-test.pdf).Length -eq 0) {
            throw "Smoke-test PDF was not created"
          }

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package_dir="dist/${{ matrix.archive }}"
          mkdir -p "$package_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" README.md LICENSE "$package_dir/"
          tar -C dist -czf "dist/${{ matrix.package }}" "${{ matrix.archive }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "dist/${{ matrix.archive }}"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}", README.md, LICENSE $packageDir
          Compress-Archive -Path "$packageDir/*" -DestinationPath "dist/${{ matrix.package }}"

      - name: Upload packaged binary
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.package }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches crate version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Download packaged binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --verify-tag \
              --generate-notes \
              --title "md2pdf ${GITHUB_REF_NAME#v}"
          fi
