[package]
name = "md2pdf"
version = "3.0.1"
edition = "2024"
description = "Fast, standalone Markdown to PDF converter written in Rust"
license = "MIT"
authors = ["0xtlt"]
repository = "https://github.com/0xtlt/md2pdf"
homepage = "https://github.com/0xtlt/md2pdf"
readme = "README.md"
keywords = ["markdown", "pdf", "typst", "cli", "syntax-highlighting"]
categories = ["command-line-utilities", "text-processing"]
publish = false

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
pulldown-cmark = "0.13.4"
thiserror = "2.0.18"
typst = "0.15.0"
typst-as-lib = "0.16.0"
typst-layout = "0.15.0"
typst-pdf = "0.15.0"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
