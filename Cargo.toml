[package]
name = "md2pdf"
version = "3.2.0"
edition = "2024"
description = "Fast, standalone Markdown to PDF converter written in Rust"
license = "MIT"
authors = ["0xtlt"]
repository = "https://github.com/0xtlt/md2pdf"
homepage = "https://github.com/0xtlt/md2pdf"
readme = "README.md"
keywords = ["markdown", "pdf", "typst", "cli", "syntax-highlighting"]
categories = ["command-line-utilities", "text-processing"]
publish = false

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
pulldown-cmark = "0.13.4"
shiki = { version = "0.0.7", default-features = false }
shiki-macros = "0.0.7"
syntect = { version = "5.3.0", default-features = false, features = ["regex-onig"] }
thiserror = "2.0.18"
tokio = { version = "1.47.1", default-features = false, features = ["rt-multi-thread"] }
typst = "0.15.0"
typst-as-lib = "0.16.0"
typst-layout = "0.15.0"
typst-pdf = "0.15.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
tikv-jemallocator = { version = "0.6.0", features = ["unprefixed_malloc_on_supported_platforms"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
